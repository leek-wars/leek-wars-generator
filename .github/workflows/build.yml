# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    # Self-hosted seulement sur le repo privé (consomme le quota). Le public
    # leek-wars/leek-wars-generator reste sur ubuntu-latest (gratuit, pas de
    # runner exposé aux forks).
    runs-on: ${{ github.repository == '5pilow/leek-wars-generator-private' && fromJSON('["self-hosted", "leekwars-generator"]') || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'corretto'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.2.1'

    - name: Download custom isolate image
      timeout-minutes: 10
      env:
        ISOLATE_MIN_SPEED: 1048576
      run: sh libs/fetch-isolate.sh

    - name: Build
      run: gradle jar
    - name: Unit tests
      run: gradle :test
    - name: Python isolate leak tests (#4999, graalpython#1083)
      run: gradle :pythonLeakTest
    - name: Integration tests
      run: |
        java -jar generator.jar --analyze test/ai/basic.leek
        java -jar generator.jar test/scenario/scenario1.json

  # Déploiement : le serveur recompile le worker et le démon avec le master de ce dépôt.
  # Job à part, sur une machine neuve et sans checkout : aucun code du dépôt ne tourne à côté
  # du jeton. Seulement depuis le dépôt canonique, que compile le serveur (jamais depuis un
  # fork : le secret n'y existe pas et le serveur privé ne doit pas être sollicité).
  deploy:
    needs: build
    if: github.event_name == 'push' && github.repository == 'leek-wars/leek-wars-generator'
    runs-on: ubuntu-latest
    # Le jeton est un secret de l'environnement `deploy`, limité à master.
    environment: deploy
    steps:
    - name: Trigger server deploy
      env:
        GH_TOKEN: ${{ secrets.SERVER_DISPATCH_PAT }}
      run: gh api repos/5pilow/leek-wars/dispatches -f event_type=generator-updated
