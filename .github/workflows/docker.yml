name: Docker image

# Publie l'image ghcr.io/leek-wars/leek-wars-generator (moteur + isolate + data),
# pour que joueurs et devs testent une IA en local sans rien builder :
#   docker run --rm -v "$PWD":/ai ghcr.io/leek-wars/leek-wars-generator --analyze /ai/mon_ia.js

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'data/**'
      - 'build.gradle'
      - 'Dockerfile'
      - '.dockerignore'
      - 'leekscript'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Image publiée uniquement depuis le repo canonique (un fork n'a pas accès au
    # package de l'org, et son GITHUB_TOKEN ne peut pas y pousser).
    if: github.repository == 'leek-wars/leek-wars-generator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/leek-wars/leek-wars-generator
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
